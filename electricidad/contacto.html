<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="pagina.css" />
    <title>Contacto — Tienda Sonido Vivo</title>
</head>
<body>
    <header>
        <h1>Tienda Sonido Vivo</h1>

        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="paginaPrincipal.html">Tienda Sonido Vivo</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="paginaPrincipal.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                        <li class="nav-item"><a class="nav-link" href="novedades.html">Novedades</a></li>
                        <li class="nav-item"><a class="nav-link" href="seleccion.html">Selección (<span id="contadorSeleccion">0</span>)</a></li>
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="contacto.html">Contacto</a></li>
                        <li class="nav-item"><a class="nav-link" href="registroUsuario.html">Registrarse</a></li>
                        <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section>
            <div class="contacto">
                <h2>¿Tienes alguna duda? Contáctanos</h2>
                <form id="formularioContacto" novalidate>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" maxlength="100" required>

                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" maxlength="100" required>

                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="6" maxlength="500" required></textarea>

                    <p id="mensajeContacto" class="mensaje-form" role="alert" aria-live="polite"></p>

                    <input type="submit" value="Enviar">
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>Tienda Sonido Vivo © 2026</p>
        <p>Todos los derechos reservados.</p>
        <p>Contacto: contacto@sonidovivo.cl</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="productos.js"></script>
    <script src="contacto.js"></script>
</body>
</html>
