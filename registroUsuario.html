      <header>
        <h1>Registro de Usuario</h1>

      <main> 
           <secton>
            <div class="registro>">
                <form id="formularioRegistro">
                    <label for="run">RUN:</label>
                    <input type="text" id="run" name="run"><br><br>

                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre"><br><br>

                    <label for="apellido">Apellido:</label>
                    <input type="text" id="apellido" name="apellido"><br><br>

                    <label for="correo">Correo electronico:</label>
                    <input type="text" id="correo electronico" name="correo electronico"><br><br>

                    <label for="tipoUsuario">Tipo de usuario:</label>
                     <select id="tipoUsuario" name="tipoUsuario"> 
                    <option value="">Seleccione un tipo</option> <option value="cliente">Cliente</option>
                   </select>
                   <label for="region">Región:</label>
                    <select id="region" name="region">
                   <option value="">Seleccione una región</option> 
                   </select> 
                   <label for="comuna">Comuna:</label>
                    <select id="comuna" name="comuna"> <option value="">Seleccione una comuna</option>
                   </select> <label for="direccion">Dirección:</label>
                    <input type="text" id="direccion" name="direccion">
                     <input type="submit" value="Registrar">

                   

                    


                </form>


            </div>
           </secton>
